<div class="container p-5" *ngIf="product; else loading">
  <button pButton icon="pi pi-arrow-right" label="חזרה לקטלוג" routerLink="/products" class="p-button-text mb-4"></button>

  <div class="grid shadow-4 border-round bg-white overflow-hidden" style="min-height: 550px;">
    
    <div class="col-12 md:col-7 p-0 bg-white border-left-1 border-100 flex align-items-center">
      <p-galleria [value]="images" [(activeIndex)]="activeIndex" 
                  [showThumbnails]="images.length > 1" [showItemNavigators]="true" 
                  [circular]="true" [containerStyle]="{'width': '100%', 'background': 'white'}">
        
        <ng-template pTemplate="item" let-item>
          <img [src]="item.itemImageSrc" style="width: 100%; height: 500px; object-fit: contain; display: block;" />
        </ng-template>

        <ng-template pTemplate="thumbnail" let-item let-index="index">
          <div class="p-1" (mouseenter)="onImageChange(index)" (click)="onImageChange(index)">
            <img [src]="item.thumbnailImageSrc" style="width: 80px; height: 60px; object-fit: cover; cursor: pointer;" 
                 [ngClass]="{'border-primary border-3': activeIndex === index}" class="border-round" />
          </div>
        </ng-template>
      </p-galleria>
    </div>

    <div class="col-12 md:col-5 p-5 flex flex-column">
      <div class="flex justify-content-between align-items-center mb-3">
        <h1 class="text-4xl font-bold text-900 m-0">{{ product.title }}</h1>
        <span class="p-tag p-tag-warning text-lg px-3 border-round-lg">{{ product.dealType }}</span>
      </div>
      
      <p class="text-600 mb-4 text-xl"><i class="pi pi-map-marker mr-2"></i>{{ product.city }}</p>
      <div class="text-5xl font-bold text-primary mb-5">₪{{ product.price | number }}</div>

      <div class="mb-4" *ngIf="product.dealType !== 'מכירה'">
        <label class="block font-bold mb-2">בחירת תאריכים:</label>
        <p-calendar [(ngModel)]="rangeDates" selectionMode="range" [readonlyInput]="true" 
                    [minDate]="minDate" placeholder="בחר תאריכי שהייה" styleClass="w-full" [showIcon]="true"></p-calendar>
      </div>

      <div class="surface-50 p-4 border-round mb-4 flex-grow-1">
        <h3 class="mt-0 border-bottom-1 border-200 pb-2">תיאור</h3>
        <p class="text-700 line-height-3 m-0">{{ product.description }}</p>
      </div>

      <div class="grid text-center border-top-1 border-200 pt-4 mb-4">
        <div [class]="product.dealType === 'מכירה' ? 'col-12' : 'col-6 border-right-1 border-200'">
          <span class="block text-500 font-bold mb-1">חדרים</span>
          <span class="text-3xl font-bold text-900">{{ product.rooms }}</span>
        </div>
        
        <div class="col-6" *ngIf="product.dealType !== 'מכירה'">
          <span class="block text-500 font-bold mb-1">מיטות</span>
          <span class="text-3xl font-bold text-900">{{ product.beds }}</span>
        </div>
      </div>

      <div class="flex flex-column gap-3">
        <button pButton label="הוספה לסל" icon="pi pi-shopping-cart" 
                class="w-full p-3 text-xl font-bold"
                [disabled]="!canAddToCart()" (click)="addToCart()"></button>
        
        <button pButton label="פרטי מפרסם" icon="pi pi-lock" 
                class="w-full p-3 p-button-outlined p-button-secondary font-bold"></button>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="flex justify-content-center align-items-center p-8">
    <i class="pi pi-spin pi-spinner text-primary" style="font-size: 3rem"></i>
  </div>
</ng-template>
