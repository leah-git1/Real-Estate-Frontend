<div class="container p-5" *ngIf="product; else loading">
  <button pButton icon="pi pi-arrow-right" [label]="returnUrl === '/profile' ? 'חזרה למוצרים שלי' : 'חזרה לקטלוג'" 
          (click)="goBack()" class="p-button-text mb-4"></button>

  <div class="grid shadow-4 border-round bg-white overflow-hidden" style="min-height: 550px;">
    <div class="col-12 md:col-7 p-0 bg-white border-left-1 border-100">
      <div class="flex" style="height: 100%;">
        <div class="flex-grow-1 flex align-items-center justify-content-center relative" style="background: #f8f9fa;">
          <img [src]="images[activeIndex]?.itemImageSrc" 
               style="width: 100%; height: 550px; object-fit: contain;" />
          
          <!-- חיצים למעבר בין תמונות -->
          <button *ngIf="images.length > 1" 
                  pButton icon="pi pi-chevron-left" 
                  class="p-button-rounded p-button-text absolute" 
                  style="left: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white;"
                  (click)="previousImage()"></button>
          
          <button *ngIf="images.length > 1" 
                  pButton icon="pi pi-chevron-right" 
                  class="p-button-rounded p-button-text absolute" 
                  style="right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white;"
                  (click)="nextImage()"></button>
        </div>
        
        <div class="flex flex-column gap-2 p-3" style="width: 120px; overflow-y: auto; max-height: 550px; background: white;">
          <div *ngFor="let img of images; let i = index" 
               (click)="onImageChange(i)"
               class="cursor-pointer border-round overflow-hidden"
               [ngClass]="{'border-3 border-primary': activeIndex === i, 'border-1 border-200': activeIndex !== i}">
            <img [src]="img.thumbnailImageSrc" 
                 style="width: 100%; height: 80px; object-fit: cover; display: block;" />
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 md:col-5 p-5 flex flex-column">
      
      <div class="mb-3">
        <div class="flex justify-content-between align-items-start mb-2">
          <h1 class="text-3xl font-bold text-900 m-0">{{ product.title }}</h1>
          <span class="p-tag p-tag-warning text-sm px-2 py-1">{{ product.transactionType }}</span>
        </div>
        <p class="text-600 text-lg m-0"><i class="pi pi-map-marker mr-2"></i>{{ product.city }}</p>
      </div>
      <div class="text-4xl font-bold text-primary mb-4">₪{{ product.price | number }}</div>

      <div class="grid text-center border-1 border-200 border-round mb-4 p-3" *ngIf="product.transactionType !== 'Sale'">
        <div class="col-6 border-left-1 border-200">
          <span class="block text-500 font-semibold mb-1">חדרים</span>
          <span class="text-2xl font-bold text-900">{{ product.rooms }}</span>
        </div>
        
        <div class="col-6">
          <span class="block text-500 font-semibold mb-1">מיטות</span>
          <span class="text-2xl font-bold text-900">{{ product.beds }}</span>
        </div>
      </div>

      <div class="surface-50 p-3 border-round mb-4">
        <h3 class="mt-0 mb-2 text-lg font-bold">תיאור</h3>
        <p class="text-700 line-height-3 m-0 text-sm">{{ product.description }}</p>
      </div>

      <div class="mb-4" *ngIf="product.transactionType !== 'Sale'">
        <label class="block font-bold mb-2 text-sm">בחירת תאריכים:</label>
        <p-datepicker [(ngModel)]="rangeDates" 
                    selectionMode="range" 
                    [readonlyInput]="true" 
                    [minDate]="minDate" 
                    [disabledDates]="disabledDates"
                    placeholder="בחר תאריכי שהייה" 
                    styleClass="w-full" 
                    [showIcon]="true"
                    dateFormat="dd/mm/yy"
                    (onMonthChange)="onMonthChange($event)"
                    (ngModelChange)="onDateChange($event)"></p-datepicker>
        
        <div *ngIf="disabledDates.length > 0" class="mt-2 p-2 bg-red-50 border border-red-200 rounded text-sm">
          <span class="text-red-600 font-semibold">⚠️ תאריכים תפוסים: </span>
          <span class="text-red-700">
            <span *ngFor="let date of disabledDates; let i = index">
              {{ date.getDate() }}/{{ date.getMonth() + 1 }}<span *ngIf="i < disabledDates.length - 1">, </span>
            </span>
          </span>
        </div>
        
        <div *ngIf="availabilityMessage" 
             [ngClass]="{'text-red-500': !isRangeAvailable, 'text-green-500': isRangeAvailable}"
             class="mt-2 text-sm font-semibold">
          {{ availabilityMessage }}
        </div>
      </div>

      <div class="flex flex-column gap-2 mt-auto">
        <button pButton label="הוספה לסל" icon="pi pi-shopping-cart" 
                class="w-full p-2 font-bold"
                [disabled]="!canAddToCart()" (click)="addToCart()"></button>
        
        <button pButton label="פרטי מפרסם" icon="pi pi-phone" 
                class="w-full p-2 p-button-outlined p-button-secondary font-bold"></button>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="flex justify-content-center align-items-center p-8">
    <i class="pi pi-spin pi-spinner text-primary" style="font-size: 3rem"></i>
  </div>
</ng-template>
