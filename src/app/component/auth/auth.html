<p-toast></p-toast>

<div class="auth-container">
    <p-card [header]="isLoginMode ? 'כניסת משתמש' : 'הרשמה למערכת'" [style]="{ width: '450px' }">

        <form #authForm="ngForm" (ngSubmit)="onSubmit()">

            <div class="field">
                <label for="email">אימייל</label>
                <input *ngIf="isLoginMode" pInputText id="email_login" name="email_login" type="email"
                    [(ngModel)]="loginData.email" required class="w-full" placeholder="הכנס אימייל" />

                <input *ngIf="!isLoginMode" pInputText id="email_reg" name="email_reg" type="email"
                    [(ngModel)]="registerData.email" required class="w-full" placeholder="בחר אימייל להרשמה" />
            </div>

            <div class="field">
                <label for="password">סיסמה</label>
                
                <p-password *ngIf="isLoginMode" id="password_login" name="password_login"
                    [(ngModel)]="loginData.password" [feedback]="false" [toggleMask]="true" styleClass="w-full"
                    inputStyleClass="w-full" required placeholder="הכנס סיסמה"></p-password>

                <div *ngIf="!isLoginMode">
                    <p-password id="password_reg" name="password_reg"
                        [(ngModel)]="registerData.password" [feedback]="true" [toggleMask]="true" styleClass="w-full"
                        inputStyleClass="w-full" required placeholder="בחר סיסמה חזקה"></p-password>
                    
                    <small class="p-error block mt-1" *ngIf="registerData.password && registerData.password.length < 8">
                        הסיסמה חייבת להכיל לפחות 8 תווים.
                    </small>
                </div>
            </div>

            <div *ngIf="!isLoginMode" class="registration-fields">
                <div class="field">
                    <label for="fullName">שם מלא</label>
                    <input pInputText id="fullName" name="fullName" [(ngModel)]="registerData.fullName" required
                        class="w-full" placeholder="ישראל ישראלי" />
                </div>

                <div class="field">
                    <label for="phone">טלפון</label>
                    <input pInputText id="phone" name="phone" [(ngModel)]="registerData.phone" required class="w-full"
                        placeholder="050-0000000" />
                </div>

                <div class="field">
                    <label for="address">כתובת</label>
                    <input pInputText id="address" name="address" [(ngModel)]="registerData.address" required
                        class="w-full" placeholder="רחוב, עיר" />
                </div>
            </div>

            <div class="actions mt-4">
                <p-button [label]="isLoginMode ? 'התחברות' : 'צור חשבון חדש'" 
                    type="submit" 
                    [disabled]="!authForm.valid || (!isLoginMode && registerData.password.length < 8)"
                    styleClass="p-button-primary w-full mb-2">
                </p-button>

                <p-button [label]="isLoginMode ? 'עדיין אין לך חשבון? הירשם כאן' : 'כבר יש לך חשבון? התחבר כאן'"
                    (onClick)="toggleMode()" [link]="true" styleClass="w-full">
                </p-button>
            </div>

        </form>
    </p-card>
</div>
