<div class="card p-4 shadow-1 border-round">
    <h5>סינון מוצרים</h5>
    <div class="flex flex-column gap-3">
        <span class="p-float-label">
            <input pInputText id="city" [(ngModel)]="filterData.city" class="w-full" />
            <label for="city">עיר</label>
        </span>

        <div class="grid">
            <div class="col-6">
                <p-inputNumber [(ngModel)]="filterData.minPrice" placeholder="מחיר מ-" class="w-full"></p-inputNumber>
            </div>
            <div class="col-6">
                <p-inputNumber [(ngModel)]="filterData.maxPrice" placeholder="עד-" class="w-full"></p-inputNumber>
            </div>
        </div>

        <p-inputNumber [(ngModel)]="filterData.beds" placeholder="מספר מיטות" [showButtons]="true" class="w-full"></p-inputNumber>

        <div class="flex gap-2">
            <p-button label="סנן" icon="pi pi-search" (onClick)="search()" class="flex-grow-1"></p-button>
            <p-button label="נקה" icon="pi pi-trash" styleClass="p-button-secondary" (onClick)="clear()"></p-button>
        </div>
    </div>
</div>
