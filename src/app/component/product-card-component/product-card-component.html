<div class="product-card shadow-2 p-3 border-round mb-4 bg-white">
  <div class="text-center mb-3 relative">
    <img [src]="product.imageUrl" [alt]="product.title" 
         style="width: 100%; height: 200px; object-fit: cover; cursor: pointer;" 
         class="border-round"
         (click)="viewDetails(product.productId)">
    <span class="absolute top-0 right-0 m-2 px-3 py-1 border-round text-white font-semibold text-sm"
          [ngClass]="{
            'bg-blue-500': product.transactionType === 'Sale',
            'bg-green-500': product.transactionType === 'Rent',
            'bg-orange-500': product.transactionType === 'Vacation'
          }">
      {{ product.transactionType === 'Sale' ? 'למכירה' : 
         product.transactionType === 'Rent' ? 'להשכרה' : 'נופש' }}
    </span>
  </div>

  <div class="font-bold text-xl mb-2">{{ product.title }}</div>
  <div class="text-primary font-bold text-lg mb-3">₪{{ product.price | number }}</div>

  <div class="flex gap-2">
    
    <button pButton pRipple 
            icon="pi pi-shopping-cart" 
            label="הוסף לסל" 
            class="p-button-success flex-grow-1"
            (click)="addToCart(product)">
    </button>
    
    <button pButton pRipple 
            icon="pi pi-info-circle" 
            class="p-button-outlined p-button-secondary"
            title="לחץ לצפייה בפרטים נוספים"
            (click)="viewDetails(product.productId)">
    </button>

  </div>
</div>
